# Regras padrão do gitleaks (SEC-08). Exceção só para as chaves falsas
# de backend/tests/core/test_logging.py, marcadas por nome.
[extend]
useDefault = true

[[allowlists]]
description = "chaves falsas dos testes de redação de log"
regexTarget = "match"
regexes = ['''(?i)(Teste|Outro|Outra)(Token|Chave)''']
paths = ['''^backend/tests/''']
condition = "AND"
