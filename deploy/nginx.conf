# nginx do container frontend. Roda como UID 1000, sem root (SEC-23).
# pid e temporários em /tmp: o resto do filesystem não é gravável por esse UID.
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Só o Caddy (172.28.0.11) define o esquema; o resto usa o da própria conexão (SEC-27).
    map "$remote_addr:$http_x_forwarded_proto" $snook_fwd_proto {
        default              $scheme;
        "172.28.0.11:https"  https;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 1m;

        # Headers de SEC-13. HSTS fica só no Caddy (perfil lan).
        # Nenhum location declara add_header ou proxy_set_header: nginx não herda
        # essas diretivas quando o location declara as suas.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), display-capture=(self)" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Evita header duplicado: vale o do nginx.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;

        # Resolve `backend` a cada requisição: `nginx -t` passa sem o backend no ar
        # e a troca de perfil cpu/gpu, que muda o IP do alias, não exige reiniciar o nginx.
        # /tmp/resolver.conf sai do entrypoint da imagem, com o DNS de /etc/resolv.conf (frontend/Dockerfile).
        include /tmp/resolver.conf;
        set $snook_backend "backend:8000";

        # SEC-27: nginx acrescenta o IP de quem conectou; esquema só do Caddy.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $snook_fwd_proto;

        # Upload: 510m dá folga de multipart sobre os 500 MiB; o backend recusa o excesso com 413 (ADR-0018).
        # nginx confere Content-Length contra o limite do location casado, e de novo a cada rewrite.
        # Por isso o location do upload tem 510m e os métodos que não são POST voltam para /__api_json (1m).
        location = /api/meetings {
            client_max_body_size 510m;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            if ($request_method != POST) {
                rewrite ^ /__api_json last;
            }
            proxy_pass http://$snook_backend;
        }

        location = /__api_json {
            internal;
            proxy_pass http://$snook_backend/api/meetings$is_args$args;
        }

        location /api/ {
            proxy_pass http://$snook_backend;
        }

        # Assets do Vite têm hash no nome.
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        # SPA: rota do cliente volta index.html.
        location / {
            expires epoch;
            try_files $uri /index.html;
        }
    }
}
