[project]
name = "snook"
version = "0.1.0"
description = "Snook: transcrição local de reuniões e geração de backlog."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "bcrypt>=4.2",
    "cryptography>=44",
    "fastapi>=0.160.0",
    "httpx>=0.28.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "models_real: usa modelos reais (opcional, rodado à mão)",
    "llm_real: usa chaves reais de provedor (opcional, rodado à mão)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "snook"

[[tool.importlinter.contracts]]
name = "shared não importa modules"
type = "forbidden"
source_modules = ["snook.shared"]
forbidden_modules = ["snook.modules"]

[[tool.importlinter.contracts]]
name = "core não importa modules, shared, cli nem main"
type = "forbidden"
source_modules = ["snook.core"]
forbidden_modules = ["snook.modules", "snook.shared", "snook.cli", "snook.main"]

[[tool.importlinter.contracts]]
name = "módulos não importam cli nem main"
type = "forbidden"
source_modules = ["snook.modules", "snook.shared", "snook.core"]
forbidden_modules = ["snook.cli", "snook.main"]
